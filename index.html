<div id="bar"><span id="tip"></span><b id="cd"></b></div>
<p>Setas ou WASD (ou deslize o dedo) para mover. Pegue todos os capilés e fuja das onças e dos jacarés. A garrafa dourada da Thom assusta os bichos por alguns segundos.</p>
