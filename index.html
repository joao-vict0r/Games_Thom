<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capi-Man Thom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<link rel="stylesheet" href="capi-man-thom.css">
</head>
<body>

<div id="hud"><b id="sc" title="Pontos">0</b><b id="hs" title="Recorde">0</b><b id="lv" title="Nível">1</b><span id="vd" title="Vidas"></span><span id="hud-actions"><button id="fs" type="button" aria-label="Entrar em tela inteira" title="Tela inteira">⛶</button><button id="mu" type="button" aria-label="Ligar ou desligar o som" title="Som">🔊</button></span></div>
<canvas id="c" width="456" height="504" aria-label="Jogo da capivara"></canvas>
<div id="bar"><span id="tip"></span><b id="cd"></b></div>
<button id="pause" type="button" aria-label="Pausar o jogo">Pausar</button>
<p>Setas ou WASD (ou deslize o dedo) para mover. Pegue todos os capilés e fuja das onças e dos jacarés. A garrafa dourada da Thom assusta os bichos por alguns segundos.</p>
<script src="capi-man-thom.js" defer></script>
</body>
</html>
